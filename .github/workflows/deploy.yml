name: Deploy to cPanel (FTP)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload to hosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # আপনার hisab ফোল্ডারের পথ। মূল cPanel FTP হলে সাধারণত এটাই।
          # FTP account যদি hisab ফোল্ডারেই scoped হয়, তাহলে ./ করে দিন।
          server-dir: public_html/hisab/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            **/*.sql
